[workspace]
resolver = "2"
members = [
    "crates/ica-domain",
    "crates/ica-application",
    "crates/ica-contracts",
    "crates/ica-infra",
    "crates/ica-api",
    "crates/ica-desktop",
    "crates/ica-server",
]
# The Tauri desktop host (P1 dual-backend routing, migrated per the signed
# ADR-0007) is its own workspace: tauri 2's dependency tree must not share
# the backend's build plan.
exclude = ["desktop/tauri-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
# SPE-BAS-002 §5.2/§5.3: public package metadata has one source of truth.
# LICENSE (repo root, MIT) and CHANGELOG.md stay in sync with these fields.
license = "MIT"
repository = "https://github.com/BryanTianjx/rica"

# SPE-BAS-002 §8.5: one lint baseline for the whole workspace. Members inherit
# it with `[lints] workspace = true`; no crate defines its own competing set.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# DEFERRED (SPEC-BAS-002 §8.5 target: library warn+). Workspace lints are
# uniform — Cargo forbids a member overriding an inherited lint — and
# `-D warnings` promotes warn to deny. Measured on this tree: 265 missing
# documentation items. Declared at `allow` so the strict lints below remain
# active and the gate stays green; the doc rollout is a tracked follow-up.
missing_docs = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
await_holding_lock = "deny"
dbg_macro = "deny"
# DEFERRED for the same reason (measured: 16 unwrap/expect on the first
# checked targets, 187 call sites in tree). Target per §8.5: library deny,
# application warn; a per-crate rollout is required before tightening.
unwrap_used = "allow"
expect_used = "allow"
todo = "warn"

# Single source of truth for dependency versions. The layering rule is
# encoded here as much as in the source: ica-domain and ica-application are
# deliberately absent from every web/database/runtime entry below.
[workspace.dependencies]
# ── domain / application (no framework, no runtime) ───────────────────────
# SPE-BAS-002 §10.1: library/domain error types derive thiserror. Version 2 is
# already in Cargo.lock (transitively); declaring it here makes the direct
# dependency explicit and single-sourced.
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
async-trait = "0.1"
# Content fingerprint (`content_hash`): pure computation, so the domain keeps
# the duplicate-detection rule instead of the adapter.
sha2 = "0.10"
# `normalize_name` (candidate extraction) matches Python's
# `unicodedata.normalize("NFKC", name)`.
unicode-normalization = "0.1"
# Browser Runtime POC (B1): the worker drives Chromium over the DevTools
# protocol over a plain local WebSocket (no TLS for `ws://127.0.0.1`).
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
aes-gcm = "0.10"
base64 = "0.22"
# AI-context redaction (`redact_for_ai` port): pure pattern work, no runtime.
regex = "1"

# ── persistence ───────────────────────────────────────────────────────────
# Runtime queries only (D7): no compile-time DATABASE_URL, no `sqlx::query!`
# macro, so `cargo build` never needs a database.
# sqlx 0.9.1's SQLite driver accepts libsqlite3-sys <0.41, so it can share the
# patched 0.40.x required by rusqlite 0.43 (RUSTSEC-2026-0459).
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
# Primary keys are UUID4 strings, exactly like the Python `new_uuid()`.
uuid = { version = "1", features = ["v4"] }

# ── HTTP ──────────────────────────────────────────────────────────────────
axum = "0.8"
# The outbound AI provider client (W5's real DraftGenerator): plain
# OpenAI-compatible chat completions. rustls keeps the WSL and Windows builds
# free of a system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps a JSON object's insertion order, which the baseline's
# `json.dumps(metadata)` relies on — it does NOT sort the keys.
serde_json = { version = "1", features = ["preserve_order"] }
# Screenshot OCR: the SAME model set the Python baseline runs (RapidOCR
# PP-OCRv6 small via ONNX Runtime), so the recognised text matches
# instead of merely being "some OCR".
rapidocr-core = "0.3.0"
# Decoding an image up front, so a truncated or non-image file is a 4xx
# rather than an inference failure.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Query-string decoding for the `ApiQuery` extractor. Both are already in the
# dependency tree through axum; declaring them keeps the last-value-wins
# semantics explicit instead of reaching into axum's internals.
form_urlencoded = "1"
serde_urlencoded = "0.7"

# ── runtime / observability ───────────────────────────────────────────────
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "io-std", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ── tests ─────────────────────────────────────────────────────────────────
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# Internal crates
ica-domain = { path = "crates/ica-domain" }
ica-application = { path = "crates/ica-application" }
ica-contracts = { path = "crates/ica-contracts" }
ica-infra = { path = "crates/ica-infra" }
ica-api = { path = "crates/ica-api" }
ica-desktop = { path = "crates/ica-desktop" }
