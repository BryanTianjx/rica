[package]
name = "ica-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tauri IPC command layer for the ICA backend: the desktop adapter over the same contract and use cases as ica-api."

# Adapter layer (like ica-server): it wires the ports to SQLite and renders
# the contract for one transport. No axum — the HTTP adapter lives in
# ica-api; the Tauri runtime itself is wired by the shell host on top of this
# crate's command functions (each is a plain async fn so it can be wrapped
# with `#[tauri::command]` without this crate depending on the tauri stack).
[dependencies]
ica-contracts.workspace = true
ica-domain.workspace = true
ica-application.workspace = true
ica-infra.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
sha2.workspace = true
tokio.workspace = true
# Browser Runtime POC (B1): the worker drives Chromium over the DevTools
# protocol on a plain local WebSocket (`ws://127.0.0.1`, no TLS).
tokio-tungstenite.workspace = true
futures-util.workspace = true
# POC scope note: the supervisor writes browser_sessions/tasks/actions
# rows directly. When B1 graduates, these row-ops move behind an
# ica-application port (B0-08 / B2 decide the final shape).
sqlx.workspace = true

[[bin]]
name = "ica-browser-worker"
path = "src/bin/ica-browser-worker.rs"

[dev-dependencies]
sqlx.workspace = true
tokio.workspace = true
tempfile.workspace = true
base64.workspace = true
