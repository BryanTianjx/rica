[package]
name = "ica-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite persistence adapters for the ICA backend (sqlx, runtime queries)."

[dependencies]
sha2 = { workspace = true }
# W6 auth: bcrypt password hashing, HS256 access tokens, random refresh tokens
# (the baseline uses passlib/bcrypt + PyJWT + secrets.token_urlsafe).
bcrypt = "0.15"
jsonwebtoken = "9"
rand = "0.8"
# The outbound AI provider (W5 real DraftGenerator): OpenAI-compatible chat
# completions over TLS; rustls keeps Linux/Windows builds off system OpenSSL.
reqwest.workspace = true
# The reasoning-block stripper in extract_json (Python re.DOTALL behavior).
regex.workspace = true
# The SQLite online-backup API (W5 backups): consistent copies of the live
# WAL database, in-place restore through the same file. rusqlite 0.43 uses
# libsqlite3-sys 0.40.x (patched for RUSTSEC-2026-0459); sqlx 0.9.1 accepts the
# same `links = "sqlite3"` crate, so both share one copy.
rusqlite = { version = "0.43", features = ["backup"] }
ica-domain.workspace = true
ica-application.workspace = true
# The port trait is `#[async_trait]`; implementing it needs the proc macro. It
# generates no runtime of its own — the tokio features below are only for the
# sqlx SQLite driver.
async-trait.workspace = true
sqlx.workspace = true
uuid.workspace = true
serde_json.workspace = true
# The real OCR engine: RapidOCR (PP-OCRv6) through ONNX Runtime.
rapidocr-core.workspace = true
image.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
# Export sealing (AES-256-GCM) — pure crypto, no async runtime.
aes-gcm.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true

# ── The OS credential store (W5 ai-key, project ruling) ──────────────────────
#
# `keyring` only uses a REAL platform backend when the platform feature is
# enabled. Without it the crate falls back to its in-memory **mock** store on
# Windows and macOS: every `Entry::new()` then owns a throwaway mock, so a
# written credential is unreadable one call later. The symptom is a silent
# "API key saved" followed by "API key not found".
#
# The features are therefore declared per target:
#   * Windows  → `windows-native` (Windows Credential Manager)
#   * macOS    → `apple-native`   (Keychain)
#   * Linux    → no backend: the adapter uses the baseline's 0600-file fallback
#                under `<data root>/secrets` instead (see secret_store.rs).
# `crates/ica-infra/tests/secret_store_backend.rs` fails the build if the
# platform backend is missing again.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
keyring = "3"

[lints]
workspace = true
