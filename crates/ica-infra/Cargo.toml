[package]
name = "ica-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "SQLite persistence adapters for the ICA backend (sqlx, runtime queries)."

[dependencies]
sha2 = { workspace = true }
# W6 auth: bcrypt password hashing, HS256 access tokens, random refresh tokens
# (the baseline uses passlib/bcrypt + PyJWT + secrets.token_urlsafe).
bcrypt = "0.15"
jsonwebtoken = "9"
rand = "0.8"
# The OS credential store (W5 ai-key, project ruling): Windows Credential
# Manager / macOS Keychain via one cross-platform seam.
keyring = "3"
# The outbound AI provider (W5 real DraftGenerator): OpenAI-compatible chat
# completions over TLS; rustls keeps Linux/Windows builds off system OpenSSL.
reqwest.workspace = true
# The reasoning-block stripper in extract_json (Python re.DOTALL behavior).
regex.workspace = true
# The SQLite online-backup API (W5 backups): consistent copies of the live
# WAL database, in-place restore through the same file. Version-locked to
# sqlx's libsqlite3-sys 0.30.x (a `links = "sqlite3"` crate: only one copy).
rusqlite = { version = "0.32", features = ["backup"] }
ica-domain.workspace = true
ica-application.workspace = true
# The port trait is `#[async_trait]`; implementing it needs the proc macro. It
# generates no runtime of its own — the tokio features below are only for the
# sqlx SQLite driver.
async-trait.workspace = true
sqlx.workspace = true
uuid.workspace = true
serde_json.workspace = true
# The real OCR engine: RapidOCR (PP-OCRv6) through ONNX Runtime.
rapidocr-core.workspace = true
image.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
# Export sealing (AES-256-GCM) — pure crypto, no async runtime.
aes-gcm.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
