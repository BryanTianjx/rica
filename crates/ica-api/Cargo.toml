[package]
name = "ica-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP surface (axum) for the ICA backend: routes, state and the error binding. The wire contract lives in ica-contracts."

[dependencies]
ica-contracts.workspace = true
ica-domain.workspace = true
ica-application.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
# Query-string decoding for the `ApiQuery` extractor — HTTP-specific, so it
# stays on this side of the contracts boundary.
form_urlencoded.workspace = true
serde_urlencoded.workspace = true
# SEC-04-B/C: verify access-token JWTs in the HTTP adapter so a real identity
# reaches the Application layer instead of the synthetic Local user.
jsonwebtoken = "9"

[dev-dependencies]
tracing-subscriber = { workspace = true }
ica-desktop.workspace = true
base64.workspace = true
ica-infra.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
http-body-util.workspace = true
tempfile.workspace = true

[lints]
workspace = true
