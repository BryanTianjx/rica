[package]
name = "ica-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Use cases and repository ports for the ICA backend."

# Layer 2. Depends on the domain and on `async-trait` (a proc macro with no
# runtime of its own). Deliberately no axum/sqlx/tokio/hyper: the port trait
# is the only seam the infra layer implements.
[dependencies]
ica-domain.workspace = true
async-trait.workspace = true
# Payloads carry parsed instants (`message_time`, `sent_at`); chrono is a pure
# value type, not a runtime or a driver.
chrono.workspace = true
# The state machine's 409 details ship a JSON array (`settable`), so the
# application error carries a serde_json value. Pure data, no runtime.
serde_json.workspace = true
# The content validator ports the baseline's regex rules (promises,
# fabricated facts, leaked identifiers).
regex.workspace = true

[dev-dependencies]
# Test fixtures build Position values, whose timestamps are chrono types.
chrono.workspace = true
