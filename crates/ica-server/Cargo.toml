[package]
name = "ica-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ICA backend binary: configuration, tracing, startup self-check, graceful shutdown."

[[bin]]
name = "ica-server"
path = "src/main.rs"

# layer and owns process concerns. The application types it names (the AI
# settings view, the secret-store port) come through the direct dependency.
[dependencies]
ica-infra.workspace = true
ica-api.workspace = true
ica-application.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
