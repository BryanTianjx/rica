# SPE-BAS-002 §13.4 — dependency and supply-chain policy (cargo-deny).
#
# Three sections are mandatory: licenses, advisories, bans. The allow list is
# the permissive license set actually present in Cargo.lock (MIT / Apache-2.0
# plus their common BSD/ISC/Zlib/Unicode companions). Weak-copyleft MPL-2.0 is
# allowed explicitly because it appears in the current tree; the project's
# distribution review must re-confirm it at each release.

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots 1.0.x (via reqwest/rustls) uses this permissive data license.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# Vulnerability and yanked advisories fail by default; unmaintained/notice are
# reported by the database scan. No advisory is suppressed without a reason.
ignore = []

[bans]
# Duplicate versions are normal in a large tree (e.g. thiserror 1 and 2).
# Warn rather than deny so the audit reports them without breaking the gate.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
